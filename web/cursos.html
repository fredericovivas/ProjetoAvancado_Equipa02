<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursos · Gestão de Cursos</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="bar">
    <strong>Gestão de Cursos</strong>
    <button type="button" id="logout" class="ghost">Terminar sessão</button>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>Cursos</h2>
      <p id="status" class="muted" role="status">A carregar cursos…</p>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>Nome</th><th>Descrição</th><th>Capacidade</th><th>Inscritos</th><th>Vagas</th><th></th></tr>
          </thead>
          <tbody id="courses-body"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2 id="form-title">Novo curso</h2>
      <form id="course-form" novalidate>
        <input type="hidden" id="course-id">

        <label for="name">Nome</label>
        <input id="name" name="name" type="text">
        <p class="error" id="name-error" role="alert"></p>

        <label for="description">Descrição</label>
        <textarea id="description" name="description" rows="3"></textarea>
        <p class="error" id="description-error" role="alert"></p>

        <label for="capacity">Capacidade</label>
        <input id="capacity" name="capacity" type="number" min="1" step="1">
        <p class="error" id="capacity-error" role="alert"></p>

        <div class="row">
          <button type="submit" id="submit-btn">Criar curso</button>
          <button type="button" id="cancel-btn" class="ghost" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>
  </main>
  <script type="module" src="js/cursos.js"></script>
</body>
</html>
